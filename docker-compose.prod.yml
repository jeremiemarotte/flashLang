# Standalone deployment compose file — pulls the pre-built api image from GHCR instead of
# building from source. Unlike docker-compose.yml, this file needs no repo clone: drop this
# file + a .env (see .env.example) anywhere on the host and run `docker compose -f
# docker-compose.prod.yml up -d`. Built by .github/workflows/docker-publish.yml on every push
# to main that touches api/.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/jeremiemarotte/flashlang-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HERMES_TOKEN: ${HERMES_TOKEN}
      PWA_TOKEN: ${PWA_TOKEN}
    ports:
      - "${API_PORT:-8000}:8000"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - backup_data:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -Fc -f "/backups/flashlang_$${ts}.dump"
          find /backups -name 'flashlang_*.dump' -mtime +30 -delete
          sleep 86400
        done

volumes:
  db_data:
  backup_data:
